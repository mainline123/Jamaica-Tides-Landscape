<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background-color: #0d3b59;
    color: #ffffff;
    height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 14px 22px;
    overflow: hidden;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    border-bottom: 4px solid #f1c40f;
    padding-bottom: 8px;
    margin-bottom: 14px;
  }

  h1 {
    font-size: 32px;
    font-weight: 900;
    letter-spacing: 1.5px;
    color: #ffffff;
    text-transform: uppercase;
  }

  .subtitle {
    font-size: 15px;
    color: #f1c40f;
    font-weight: 800;
    letter-spacing: 1.2px;
  }

  .timestamp {
    font-size: 15px;
    color: #ecf0f1;
    font-weight: 700;
  }

  .grid-container {
    height: 47vh;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
    align-items: stretch;
  }

  .card {
    background: #ffffff;
    color: #2c3e50;
    border-radius: 12px;
    padding: 13px 10px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    box-shadow: 0 8px 20px rgba(0,0,0,0.40);
  }

  .card-title {
    font-size: 21px;
    font-weight: 900;
    color: #116530;
    text-align: center;
    margin-bottom: 8px;
    border-bottom: 3px solid #bdc3c7;
    padding-bottom: 7px;
    text-transform: uppercase;
  }

  .tide-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    justify-content: space-evenly;
    height: 100%;
  }

  .tide-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 7px 4px;
    font-size: 18px;
    border-bottom: 2px dashed #dfe4ea;
  }

  .tide-item:last-child {
    border-bottom: none;
  }

  .tide-time {
    font-weight: 800;
    width: 38%;
    color: #1e272e;
  }

  .tag {
    padding: 6px 7px;
    border-radius: 6px;
    font-size: 15px;
    font-weight: 900;
    color: #fff;
    text-align: center;
    width: 30%;
  }

  .tag.high {
    background-color: #2980b9;
  }

  .tag.low {
    background-color: #c0392b;
  }

  .height {
    font-weight: 800;
    color: #2f3640;
    width: 32%;
    text-align: right;
  }

  .error-msg {
    grid-column: span 5;
    color: #e74c3c;
    text-align: center;
    font-size: 21px;
    margin-top: 30px;
    font-weight: bold;
  }
</style>
