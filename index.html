<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jamaica Coastal Tides - Live Predictions</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #0d3b59;
    }

    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #ffffff;

      /* HTML ONLY USES TOP 80% OF NOVISIGN SCREEN */
      height: 80vh;

      display: flex;
      flex-direction: column;
      padding: 14px 22px;
      overflow: hidden;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      border-bottom: 4px solid #f1c40f;
      padding-bottom: 8px;
      margin-bottom: 14px;
      flex-shrink: 0;
    }

    h1 {
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 1.5px;
      color: #ffffff;
      text-transform: uppercase;
    }

    .subtitle {
      font-size: 15px;
      color: #f1c40f;
      font-weight: 800;
      letter-spacing: 1.2px;
    }

    .timestamp {
      font-size: 15px;
      color: #ecf0f1;
      font-weight: 700;
    }

    .grid-container {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
      align-items: stretch;
      min-height: 0;
    }

    .card {
      background: #ffffff;
      color: #2c3e50;
      border-radius: 12px;
      padding: 13px 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 8px 20px rgba(0,0,0,0.40);
    }

    .card-title {
      font-size: 21px;
      font-weight: 900;
      color: #116530;
      text-align: center;
      margin-bottom: 8px;
      border-bottom: 3px solid #bdc3c7;
      padding-bottom: 7px;
      text-transform: uppercase;
    }

    .tide-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      justify-content: space-evenly;
      height: 100%;
    }

    .tide-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 7px 4px;
      font-size: 18px;
      border-bottom: 2px dashed #dfe4ea;
    }

    .tide-item:last-child {
      border-bottom: none;
    }

    .tide-time {
      font-weight: 800;
      width: 38%;
      color: #1e272e;
    }

    .tag {
      padding: 6px 7px;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 900;
      color: #ffffff;
      text-align: center;
      width: 30%;
    }

    .tag.high {
      background-color: #2980b9;
    }

    .tag.low {
      background-color: #c0392b;
    }

    .height {
      font-weight: 800;
      color: #2f3640;
      width: 32%;
      text-align: right;
    }

    .error-msg {
      grid-column: span 5;
      color: #e74c3c;
      text-align: center;
      font-size: 21px;
      margin-top: 30px;
      font-weight: bold;
    }

    .loading-msg {
      grid-column: span 5;
      color: #ffffff;
      text-align: center;
      font-size: 22px;
      margin-top: 50px;
      font-weight: 700;
    }
  </style>
</head>

<body>

  <header>
    <div>
      <h1>Jamaica Coastal Tides</h1>
      <div class="subtitle">LIVE DAILY PREDICTIONS</div>
    </div>

    <div class="timestamp" id="updated-time">
      Updating...
    </div>
  </header>

  <main class="grid-container" id="tide-grid">
    <div class="loading-msg">Loading live tide predictions...</div>
  </main>

  <script>

    function handleTideData(data) {

      const gridContainer = document.getElementById('tide-grid');

      if (!data) {
        gridContainer.innerHTML =
          '<div class="error-msg">Failed to load tide data.</div>';
        return;
      }

      if (data.updated) {
        document.getElementById('updated-time').innerText =
          'Updated: ' + data.updated;
      }

      let rows = [];

      if (Array.isArray(data.rows)) {
        rows = data.rows;
      } else if (Array.isArray(data)) {
        rows = data;
      }

      if (rows.length === 0) {
        gridContainer.innerHTML =
          '<div class="error-msg">No tide predictions currently available.</div>';
        return;
      }

      const locations = {};

      rows.forEach(row => {

        if (!Array.isArray(row) || row.length < 3) return;

        let loc = String(row[0]).trim();
        let time = String(row[2]).trim();
        let tide = row[3] ? String(row[3]).trim() : '';
        let height = row[4] ? String(row[4]).trim() : '';

        if (
          !loc ||
          loc === 'Location' ||
          loc === 'Last Updated' ||
          loc.includes(':')
        ) {
          return;
        }

        if (time.startsWith("'")) {
          time = time.substring(1);
        }

        if (!locations[loc]) {
          locations[loc] = [];
        }

        if (locations[loc].length < 4) {
          locations[loc].push({
            time,
            tide,
            height
          });
        }
      });

      gridContainer.innerHTML = '';

      const locKeys = Object.keys(locations);

      if (locKeys.length === 0) {
        gridContainer.innerHTML =
          '<div class="error-msg">Parsing error: No valid locations found.</div>';
        return;
      }

      locKeys.forEach(locName => {

        const events = locations[locName];

        const itemsHtml = events.map(evt => {

          const isHigh =
            evt.tide.toLowerCase().includes('high');

          return `
            <li class="tide-item">
              <span class="tide-time">${evt.time}</span>

              <span class="tag ${isHigh ? 'high' : 'low'}">
                ${evt.tide.toUpperCase() || 'TIDE'}
              </span>

              <span class="height">${evt.height}</span>
            </li>
          `;

        }).join('');

        const cardHtml = `
          <div class="card">

            <div class="card-title">
              ${locName}
            </div>

            <ul class="tide-list">
              ${itemsHtml}
            </ul>

          </div>
        `;

        gridContainer.innerHTML += cardHtml;

      });
    }


    function loadFeed() {

      const oldScript =
        document.getElementById('jsonp-feed');

      if (oldScript) {
        oldScript.remove();
      }

      const script =
        document.createElement('script');

      script.id = 'jsonp-feed';

      const apiUrl =
        'https://script.google.com/macros/s/AKfycbxEgTDAaaNsudZ-qe3WBW0wQF9_Tu__xv0FlRHrhmLXv8sknEjnnle3-V0txI_9ySis/exec?callback=handleTideData';

      script.src =
        apiUrl +
        '&nocache=' +
        new Date().getTime();

      script.onerror = function() {

        document.getElementById('tide-grid').innerHTML =
          '<div class="error-msg">Error connecting to endpoint.</div>';

      };

      document.body.appendChild(script);
    }


    window.onload = loadFeed;

    /* Refresh live tide data every 15 minutes */
    setInterval(loadFeed, 15 * 60 * 1000);

  </script>

</body>
</html>
