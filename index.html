<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jamaica Coastal Tides - Live Predictions</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #0d3b59;
      color: #ffffff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 12px 20px;
      overflow: hidden;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      border-bottom: 2px solid #f1c40f;
      padding-bottom: 6px;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: 1px;
      color: #ffffff;
      text-transform: uppercase;
    }

    .subtitle {
      font-size: 0.8rem;
      color: #f1c40f;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .timestamp {
      font-size: 0.8rem;
      color: #bdc3c7;
    }

    .grid-container {
      height: 48vh;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      align-items: stretch;
    }

    .card {
      background: #ffffff;
      color: #2c3e50;
      border-radius: 8px;
      padding: 8px 8px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 10px rgba(0,0,0,0.25);
    }

    .card-title {
      font-size: 1rem;
      font-weight: 700;
      color: #1e824c;
      text-align: center;
      margin-bottom: 6px;
      border-bottom: 1px solid #ecf0f1;
      padding-bottom: 4px;
    }

    .tide-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 4px;
      overflow-y: auto;
    }

    .tide-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 3px 2px;
      font-size: 0.75rem;
      border-bottom: 1px dashed #f0f0f0;
    }

    .tide-time {
      font-weight: 600;
      width: 35%;
    }

    .tag {
      padding: 2px 4px;
      border-radius: 3px;
      font-size: 0.65rem;
      font-weight: 700;
      color: #fff;
      text-align: center;
      width: 30%;
    }

    .tag.high {
      background-color: #2980b9;
    }

    .tag.low {
      background-color: #c0392b;
    }

    .height {
      font-weight: 600;
      color: #7f8c8d;
      width: 35%;
      text-align: right;
    }

    .error-msg {
      grid-column: span 5;
      color: #e74c3c;
      text-align: center;
      font-size: 1rem;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>Jamaica Coastal Tides</h1>
      <div class="subtitle">LIVE DAILY PREDICTIONS</div>
    </div>
    <div class="timestamp" id="updated-time">Updating...</div>
  </header>

  <main class="grid-container" id="tide-grid">
    <!-- Dynamic Cards Render Here -->
  </main>

  <script>
    function handleTideData(data) {
      const gridContainer = document.getElementById('tide-grid');
      
      if (!data) {
        gridContainer.innerHTML = '<div class="error-msg">Failed to load tide data.</div>';
        return;
      }

      if (data.updated) {
        document.getElementById('updated-time').innerText = 'Updated: ' + data.updated;
      }

      let rows = [];
      if (Array.isArray(data.rows)) {
        rows = data.rows;
      } else if (Array.isArray(data)) {
        rows = data;
      }

      if (rows.length === 0) {
        gridContainer.innerHTML = '<div class="error-msg">No tide predictions currently available.</div>';
        return;
      }

      const locations = {};

      rows.forEach(row => {
        if (!Array.isArray(row) || row.length < 3) return;

        let loc = String(row[0]).trim();
        let time = String(row[2]).trim();
        let tide = row[3] ? String(row[3]).trim() : '';
        let height = row[4] ? String(row[4]).trim() : '';

        if (!loc || loc === 'Location' || loc === 'Last Updated' || loc.includes(':')) return;

        if (time.startsWith("'")) time = time.substring(1);

        if (!locations[loc]) {
          locations[loc] = [];
        }

        if (locations[loc].length < 4) {
          locations[loc].push({ time, tide, height });
        }
      });

      gridContainer.innerHTML = '';

      const locKeys = Object.keys(locations);
      if (locKeys.length === 0) {
        gridContainer.innerHTML = '<div class="error-msg">Parsing error: No valid locations found.</div>';
        return;
      }

      locKeys.forEach(locName => {
        const events = locations[locName];
        
        const itemsHtml = events.map(evt => {
          const isHigh = evt.tide.toLowerCase().includes('high');
          return `
            <li class="tide-item">
              <span class="tide-time">${evt.time}</span>
              <span class="tag ${isHigh ? 'high' : 'low'}">${evt.tide.toUpperCase() || 'TIDE'}</span>
              <span class="height">${evt.height}</span>
            </li>`;
        }).join('');

        const cardHtml = `
          <div class="card">
            <div class="card-title">${locName}</div>
            <ul class="tide-list">
              ${itemsHtml}
            </ul>
          </div>`;

        gridContainer.innerHTML += cardHtml;
      });
    }

    function loadFeed() {
      const oldScript = document.getElementById('jsonp-feed');
      if (oldScript) oldScript.remove();

      const script = document.createElement('script');
      script.id = 'jsonp-feed';
      const apiUrl = 'https://script.google.com/macros/s/AKfycbxEgTDAaaNsudZ-qe3WBW0wQF9_Tu__xv0FlRHrhmLXv8sknEjnnle3-V0txI_9ySis/exec?callback=handleTideData';
      script.src = apiUrl + '&nocache=' + new Date().getTime();
      
      script.onerror = function() {
        document.getElementById('tide-grid').innerHTML = '<div class="error-msg">Error connecting to endpoint.</div>';
      };

      document.body.appendChild(script);
    }

    window.onload = loadFeed;
    setInterval(loadFeed, 15 * 60 * 1000);
  </script>
</body>
</html>
