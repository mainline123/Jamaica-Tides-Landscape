<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jamaica Tides - Landscape Display</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #021827 0%, #075076 100%);
      color: #ffffff;
      display: flex;
      flex-direction: column;
      padding: 2vh 3vw;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 3px solid #f6c41f;
      padding-bottom: 1.5vh;
      margin-bottom: 2vh;
    }
    .title-area h1 {
      font-size: 3.5vh;
      font-weight: 900;
      letter-spacing: 1px;
    }
    .title-area p {
      font-size: 1.8vh;
      color: #f6c41f;
      font-weight: 700;
      margin-top: 0.3vh;
    }
    .last-updated {
      font-size: 1.6vh;
      color: #cfd8dc;
      text-align: right;
    }
    .grid-container {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 1.5vw;
      align-items: stretch;
    }
    .card {
      background: rgba(255, 255, 255, 0.95);
      color: #12394f;
      border-radius: 12px;
      padding: 2vh 1vw;
      display: flex;
      flex-direction: column;
      box-shadow: 0 8px 16px rgba(0,0,0,0.3);
    }
    .card-title {
      font-size: 2.2vh;
      font-weight: 800;
      color: #078147;
      border-bottom: 2px solid #e0e0e0;
      padding-bottom: 1vh;
      margin-bottom: 1.5vh;
      text-align: center;
    }
    .tide-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 1vh;
      flex: 1;
    }
    .tide-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.8vh 0.5vw;
      border-bottom: 1px solid #f0f0f0;
      font-size: 1.5vh;
    }
    .tide-time {
      font-weight: 700;
    }
    .tag {
      padding: 0.4vh 0.6vw;
      border-radius: 4px;
      font-weight: 800;
      color: #ffffff;
      font-size: 1.2vh;
    }
    .tag.high {
      background-color: #0077b6;
    }
    .tag.low {
      background-color: #d90429;
    }
    .height {
      color: #555555;
      font-size: 1.3vh;
    }
    .error-msg {
      grid-column: span 5;
      text-align: center;
      font-size: 2vh;
      color: #ff6b6b;
      margin-top: 5vh;
    }
  </style>
</head>
<body>

  <header>
    <div class="title-area">
      <h1>JAMAICA COASTAL TIDES</h1>
      <p>LIVE DAILY PREDICTIONS</p>
    </div>
    <div class="last-updated" id="updated-time">
      Loading live feed...
    </div>
  </header>

  <main class="grid-container" id="tide-grid">
    <!-- Dynamic Tide Cards Output Here -->
  </main>

  <script>
    // Replace with your Google Apps Script Web App Exec URL
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwP66KnR7wD0BdmHhUQc4IboeLvOXd8UD2ODKO4_N5YkwCSmrV589cxoV4yp-QankOo/exec?feed=1';

    async function fetchTideData() {
      try {
        const response = await fetch(APPS_SCRIPT_URL);
        const data = await response.json();

        if (!data || !data.rows) {
          throw new Error('Invalid data payload received');
        }

        document.getElementById('updated-time').innerText = `Updated: ${data.updated || 'Just now'}`;
        renderGrid(data.rows);
      } catch (err) {
        console.error('Error fetching tide feed:', err);
        document.getElementById('tide-grid').innerHTML = `
          <div class="error-msg">
            Unable to load live tide data. Please check Apps Script execution logs.
          </div>`;
      }
    }

    function renderGrid(rows) {
      // Group rows by location
      const locations = {};

      rows.forEach(row => {
        const [loc, date, time, tide, height] = row;
        if (!loc) return;

        if (!locations[loc]) {
          locations[loc] = [];
        }
        locations[loc].push({ time, tide, height });
      });

      const gridContainer = document.getElementById('tide-grid');
      gridContainer.innerHTML = '';

      Object.keys(locations).forEach(locName => {
        const events = locations[locName];
        
        let itemsHtml = events.map(evt => {
          const isHigh = (evt.tide || '').toLowerCase() === 'high';
          return `
            <li class="tide-item">
              <span class="tide-time">${evt.time}</span>
              <span class="tag ${isHigh ? 'high' : 'low'}">${(evt.tide || '').toUpperCase()}</span>
              <span class="height">${evt.height}</span>
            </li>`;
        }).join('');

        const cardHtml = `
          <div class="card">
            <div class="card-title">${locName}</div>
            <ul class="tide-list">
              ${itemsHtml}
            </ul>
          </div>`;

        gridContainer.innerHTML += cardHtml;
      });
    }

    // Fetch immediately on load
    fetchTideData();

    // Auto-refresh every 30 minutes
    setInterval(fetchTideData, 30 * 60 * 1000);
  </script>
</body>
</html>
