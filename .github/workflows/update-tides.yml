name: Update Jamaica Tide Data

on:
  schedule:
    # Run every 30 minutes
    - cron: "*/30 * * * *"

  # Allows us to test it manually from GitHub
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-tides:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Update Jamaica tide data
        run: node update-tides.js

      - name: Commit updated tide data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add tide-data.json

          if git diff --cached --quiet; then
            echo "No tide data changes to commit."
          else
            git commit -m "Update Jamaica tide predictions"
            git push
          fi
