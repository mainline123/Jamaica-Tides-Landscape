<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Negril Sunset & Beach</title><style>
:root{--ink:#061b30;--aqua:#63e4e2;--sand:#ffdc92;--white:#fff;--muted:#bfd3df}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--ink);color:var(--white);font-family:Arial,Helvetica,sans-serif}.screen{width:100%;height:100dvh;display:flex;flex-direction:column;background:linear-gradient(180deg,#06203a 0%,#0c4460 45%,#0d4055 100%)}.top{padding:3.2vh 5.5vw 2vh;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.eyebrow{font-size:clamp(11px,2.2vw,25px);font-weight:800;letter-spacing:.24em;color:var(--aqua)}.brand{font-size:clamp(31px,7.8vw,80px);font-weight:900;letter-spacing:-.045em;line-height:1.03;margin-top:.7vh}.place{font-size:clamp(12px,2.5vw,26px);letter-spacing:.12em;color:#e1e9e9;margin-top:.9vh;font-weight:700}.clock{text-align:right;white-space:nowrap;font-weight:900;font-size:clamp(15px,3.4vw,36px);color:var(--sand)}.clock small{display:block;color:var(--muted);font-size:clamp(9px,1.7vw,18px);margin-top:6px;font-weight:600}.hero{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;justify-content:flex-end;padding:4vh 6vw 3vh;overflow:hidden;background:radial-gradient(circle at 69% 36%,#fff2b8 0%,#ffd16d 5%,#ff9c56 11%,transparent 24%),linear-gradient(180deg,#368ca4 0%,#ffaf80 41%,#f8b77b 50%,#256f83 51%,#0a4b68 70%,#06314b 100%)}.hero:before{content:"";position:absolute;left:-10%;right:-10%;bottom:12%;height:25%;background:repeating-linear-gradient(176deg,transparent 0 18px,rgba(255,255,255,.10) 20px 23px,transparent 26px 52px);transform:skewY(-2deg)}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,20,34,.06),rgba(4,20,34,.04) 36%,rgba(4,20,34,.83) 100%)}.heroContent{position:relative;z-index:1}.heroLabel{font-size:clamp(13px,2.7vw,28px);font-weight:900;letter-spacing:.22em;color:#fff1ca}.sunset{font-size:clamp(65px,16vw,160px);line-height:1.03;font-weight:900;letter-spacing:-.055em;margin:.9vh 0}.count{font-size:clamp(15px,3.5vw,36px);font-weight:800;color:#ffdc92}.conditions{padding:2.7vh 4vw 1.5vh;display:grid;grid-template-columns:1fr 1fr;gap:1.3vh 2.5vw;background:#08273c}.tile{padding:2.2vh 3vw;background:linear-gradient(140deg,#12455e,#0b354d);border:1px solid rgba(255,255,255,.15);border-radius:14px;min-height:10vh}.tile .label{font-size:clamp(11px,2.2vw,23px);font-weight:800;letter-spacing:.13em;color:#9edbe2}.tile .value{font-size:clamp(27px,7.3vw,76px);font-weight:900;margin-top:1vh;line-height:1}.tile .detail{font-size:clamp(11px,2vw,22px);color:#d3e2e9;margin-top:.7vh}.foot{background:#08273c;padding:1.6vh 5vw 2.5vh;border-top:1px solid rgba(255,255,255,.14);font-size:clamp(10px,1.9vw,20px);color:#d3e2e9;display:flex;justify-content:space-between;gap:1vw}.foot strong{color:var(--aqua)}.error{color:#ffdc92;font-size:clamp(12px,2.2vw,22px);font-weight:700;margin-top:1vh}@media (min-aspect-ratio: 1/1){.screen{max-width:56.25vh;margin:auto}.brand{font-size:5vh}.sunset{font-size:10vh}}
</style></head><body><div class="screen"><div class="top"><div><div class="eyebrow">JAMAICA • WEST COAST</div><div class="brand">NEGRIL<br>BEACH & SUNSET</div><div class="place">SEVEN MILE BEACH</div></div><div class="clock" id="clock">--:--<small>JAMAICA TIME</small></div></div><div class="hero"><div class="heroContent"><div class="heroLabel">TODAY'S SUNSET</div><div class="sunset" id="sunset">--:--</div><div class="count" id="countdown">Checking sunset time…</div><div class="error" id="notice"></div></div></div><div class="conditions"><div class="tile"><div class="label">AIR TEMPERATURE</div><div class="value" id="temp">--°</div><div class="detail">Current conditions</div></div><div class="tile"><div class="label">FEELS LIKE</div><div class="value" id="feels">--°</div><div class="detail">Degrees Celsius</div></div><div class="tile"><div class="label">WIND</div><div class="value" id="wind">--</div><div class="detail">km/h</div></div><div class="tile"><div class="label">UV INDEX</div><div class="value" id="uv">--</div><div class="detail" id="uvlabel">Current UV</div></div></div><div class="foot"><span>Weather: Open-Meteo • Sunset: local forecast</span><span id="updated"><strong>UPDATING</strong></span></div></div><script>
const TZ='America/Jamaica',LAT=18.2684,LON=-78.3475;let sunsetDate=null, sunriseDate=null, lastWeather=null;
const el=id=>document.getElementById(id);const jamaicaDate=(d=new Date())=>new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'}).format(d);const fmtTime=d=>new Intl.DateTimeFormat('en-US',{timeZone:TZ,hour:'numeric',minute:'2-digit',hour12:true}).format(d);
function clock(){const now=new Date();el('clock').innerHTML=fmtTime(now)+'<small>JAMAICA TIME</small>';if(sunsetDate){let diff=sunsetDate-now;if(diff>0){let m=Math.floor(diff/60000);el('countdown').textContent=`SUNSET IN ${Math.floor(m/60)}h ${m%60}m`;}else{el('countdown').textContent='SUNSET HAS PASSED • SEE YOU TOMORROW';}}}clock();setInterval(clock,15000);
async function update(){try{const url=`https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=temperature_2m,apparent_temperature,wind_speed_10m,uv_index&daily=sunrise,sunset&temperature_unit=celsius&wind_speed_unit=kmh&timezone=America%2FJamaica&forecast_days=3`;const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw Error('Weather service unavailable');const d=await r.json();if(!d.current||!d.daily?.sunset?.length)throw Error('Incomplete weather response');const c=d.current;el('temp').textContent=Math.round(c.temperature_2m)+'°';el('feels').textContent=Math.round(c.apparent_temperature)+'°';el('wind').textContent=Math.round(c.wind_speed_10m);el('uv').textContent=Number(c.uv_index).toFixed(1);let u=Number(c.uv_index);el('uvlabel').textContent=u<3?'Low':u<6?'Moderate':u<8?'High':u<11?'Very high':'Extreme';const today=jamaicaDate();let idx=d.daily.time.findIndex(x=>x===today);if(idx<0)idx=0;let iso=d.daily.sunset[idx];const parseLocal=s=>new Date(s+'-05:00');sunsetDate=parseLocal(iso);if(sunsetDate<new Date()&&d.daily.sunset[idx+1])sunsetDate=parseLocal(d.daily.sunset[idx+1]);el('sunset').textContent=fmtTime(parseLocal(iso));el('notice').textContent='';el('updated').innerHTML='<strong>UPDATED '+fmtTime(new Date())+'</strong>';clock();}catch(err){console.error(err);el('notice').textContent='Live weather temporarily unavailable';el('updated').textContent='RETRYING';}}update();setInterval(update,10*60*1000);
</script></body></html>
